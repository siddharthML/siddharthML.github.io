name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Google Scholar and update citation counts
        run: python scripts/update_scholar_citations.py
      - name: Commit a changed citation count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html publications.html
          git diff --cached --quiet || git commit -m "Update Google Scholar citation count"
          git push
